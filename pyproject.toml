[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"

[project]
name = "mapping-momentum"
version = "1.0.0"
description = "Statistics engine and report generator for mapping participation metrics."
requires-python = ">=3.14"
classifiers = [
    "Private :: Do Not Upload"
]
dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.23"
]

[project.scripts]
mapping-momentum = "mm.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = [
    "mm"
]

[tool.hatch.build.targets.wheel.shared-data]
"templates/activity_report.html" = "templates/activity_report.html"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.4"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = "-v"
markers = [
    "integration: marks tests as requiring live API calls",
    "golden: marks golden fixture tests"
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W"
]
